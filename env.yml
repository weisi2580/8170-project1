name: casp15-msa-af3
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - biopython
  - pandas
  - numpy
  - matplotlib
  - seaborn
  - logomaker
  - requests
  - pymol-open-source     # only needed for scripts/overlay.pml
  # Not required by this repo's scripts, but listed for parity with the
  # original project plan if you'd rather run a *local* MMseqs2 search
  # instead of scripts/build_msa.py's remote-API path:
  #   - mmseqs2
  # This repo evaluates structures with US-align (vendored source in
  # scripts/vendor/, built by scripts/build_usalign.sh into bin/USalign)
  # instead of a conda TMalign/lddt package, since it needed no local
  # database and is reproducible with only a C++ compiler.
